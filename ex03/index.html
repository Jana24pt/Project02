<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors and Opacity</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Color Palette</h1>

    <div class="named-color">Named Color: red</div>

    <div class="hex-color">HEX: #3498DB</div>

    <div class="rgb-color">RGB: rgb(46, 204, 113)</div>

    <div class="rgba-color">RGBA: rgba(155, 89, 182, 0.5)</div>

    <h2>Opacity vs RGBA</h2>

    <div class="opacity-box">
        <p>Opacity: 0.5</p>
    </div>

    <div class="rgba-box">
        <p>RGBA Background: 0.5</p>
    </div>

</body>
</html>
